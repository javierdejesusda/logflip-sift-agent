[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logflip-sift-agent"
version = "0.1.0"
description = "Autonomous NTFS anti-forensics triage for Protocol SIFT: a read-only MCP server and a self-correcting Claude agent over the logflip detection engine"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "anthropic>=0.39",
    "openai>=1.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
]
# The logflip detection engine (package name: logflip-closed) is a required
# companion install. It is published separately at
# github.com/javierdejesusda/logflip-closed and installed by the Dockerfile
# and the setup instructions, not resolved from PyPI.

[project.scripts]
sift-agent = "sift_agent.__main__:main"
sift-mcp = "sift_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sift_mcp*", "sift_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

# logflip-closed is a strict-typed engine but does not ship a py.typed marker as
# an installed wheel, so mypy cannot resolve its stubs from site-packages.
[[tool.mypy.overrides]]
module = ["logflip.*"]
ignore_missing_imports = true
